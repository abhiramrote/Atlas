spring.datasource.url=jdbc:postgresql://localhost:5432/atlas
spring.datasource.username=atlas
spring.datasource.password=atlas

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
twelvedata.api.key=${TWELVEDATA_API_KEY}
indianapi.api.key=${INDIANAPI_API_KEY:}
indianapi.base.url=https://stock.indianapi.in
indianapi.enabled=${INDIANAPI_ENABLED:false}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

atlas.jwt.secret=${ATLAS_JWT_SECRET:}
atlas.jwt.expiry-seconds=86400
atlas.jwt.issuer=atlas

atlas.frontend.url=${ATLAS_FRONTEND_URL:http://localhost:5173}
atlas.admin.email=${ATLAS_ADMIN_EMAIL:}